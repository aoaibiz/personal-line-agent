name: Source verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.10.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.1"
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen pytest tests/test_received_images.py tests/test_windows_ownership.py::test_new_private_objects_reopen_with_actual_user_owner
      - run: uv run --frozen pytest tests/test_additional_connection.py tests/test_square_large_frame.py
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check src tests
      - run: uv build --offline
      - run: uv run --frozen python tools/check_distribution.py
      - run: uv run --frozen pip-audit --progress-spinner off
