[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "personal-line-agent"
version = "0.2.2"
description = "Account-isolated LINE tools and durable relationship memory for MCP agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "certifi>=2026.10.19",
  "mcp>=1.26,<2",
  "cryptography>=50,<51",
  "keyring>=25,<26",
  "okline @ git+https://github.com/NiceDayZc/OkLine.git@2e3437977368802edcc2219798b9d5333665ebca",
  "qrcode>=8,<9",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1.3,<2", "pip-audit>=2.9,<3"]

[project.scripts]
line-agent = "line_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/line_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
