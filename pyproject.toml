[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "personal-line-agent"
version = "0.6.0"
description = "Account-isolated LINE tools and durable relationship memory for MCP agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "certifi>=2026.10.19",
  "mcp>=1.26,<2",
  "cryptography>=50,<51",
  "keyring>=25,<26",
  "okline @ git+https://github.com/NiceDayZc/OkLine.git@2e3437977368802edcc2219798b9d5333665ebca",
  "qrcode>=8,<9",
  "pywin32>=312; sys_platform == 'win32'",
  "tzdata>=2025.2,<2027",
  "thrift==0.24.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1.3,<2", "pip-audit>=2.9,<3"]

[project.scripts]
line-agent = "line_agent.cli:main"
line-agent-bridge = "line_agent.bridge:main"
line-agent-runtime = "line_agent.runtime:main"
line-agent-service = "line_agent.supervisor:main"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/line_agent"]

[tool.hatch.build.targets.wheel.force-include]
"adapters/linejs/worker.mjs" = "line_agent/linejs/worker.mjs"
"adapters/linejs/notes.mjs" = "line_agent/linejs/notes.mjs"
"adapters/linejs/identity.mjs" = "line_agent/linejs/identity.mjs"
"adapters/linejs/package.json" = "line_agent/linejs/package.json"
"adapters/linejs/package-lock.json" = "line_agent/linejs/package-lock.json"
"adapters/linejs/LICENSE.linejs.txt" = "line_agent/linejs/LICENSE.linejs.txt"

[tool.hatch.build.targets.sdist]
exclude = ["**/node_modules/**", "**/__pycache__/**", ".venv/**", ".monitor/**"]
include = ["src/line_agent/*.py", "tests/*.py", "tools/*.py", "docs/*.md", "docs/upgrade-20261105/*.md", "docs/upgrade-20261105/*.txt", "THIRD_PARTY_NOTICES.md", "README.md", "LICENSE", "SECURITY.md", "CONTRIBUTING.md", "AGENTS.md", "pyproject.toml", "uv.lock", "adapters/linejs/*.mjs", "adapters/linejs/package*.json", "adapters/linejs/LICENSE.linejs.txt"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
